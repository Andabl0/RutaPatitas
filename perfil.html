<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">

<title>Patitas Unidas — Perfil</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<a class="skip-link" href="#main">Saltar al contenido principal</a>
<div class="phone-frame">
  <div class="status-bar" aria-hidden="true"><span>9:52</span><span class="dot"></span><span></span></div>

  <main id="main" class="app-screen">
    <div class="topbar">
      <a class="btn-back" href="buscar-mascotas.html" aria-label="Volver">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M15 5l-7 7 7 7"/></svg>
      </a>
      <h1>Perfil</h1>
    </div>

    <div class="screen-scroll">
      <div class="profile-header">
        <div class="avatar" role="img" aria-label="Foto de perfil de Andablo">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 21c0-4 3.6-6 8-6s8 2 8 6"/><circle cx="12" cy="8" r="4"/></svg>
        </div>
        <button type="button" class="edit-photo">Cambiar foto de perfil</button>
      </div>

      <form data-validate novalidate>
        <div class="field">
          <label for="p-name">Nombre</label>
          <input type="text" id="p-name" value="Andablo" required>
          <p class="error-msg" role="alert" hidden>Escribe tu nombre.</p>
        </div>
        <div class="field">
          <label for="p-email">Correo electrónico</label>
          <input type="email" id="p-email" value="andablo@ejemplo.com" required>
          <p class="error-msg" role="alert" hidden>Escribe un correo electrónico válido.</p>
        </div>
        <div class="field">
          <label for="p-phone">Número telefónico</label>
          <input type="tel" id="p-phone" value="55 1234 5678" required>
          <p class="error-msg" role="alert" hidden>Escribe un número de teléfono válido.</p>
        </div>
        <div class="field">
          <label for="p-pass">Contraseña</label>
          <input type="password" id="p-pass" value="••••••••">
        </div>
        <button type="submit" class="btn btn-outline" style="margin-bottom:var(--space-6);">Guardar cambios</button>
      </form>

      <nav aria-label="Accesos del perfil">
        <ul class="list-menu card">
          <li>
            <a href="mi-mascota.html">
              <span class="item-icon" aria-hidden="true">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 5c-2 0-4 1.5-4 3.5S10 12 12 12s4-1.5 4-3.5S14 5 12 5z"/><path d="M12 2c5.5 0 10 4.5 10 10s-4.5 10-10 10S2 17.5 2 12 6.5 2 12 2z"/><path d="M12 6v6l3 3"/></svg>
              </span>
              Mi mascota
              <svg class="chevron" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
            </a>
          </li>
          <li>
            <a href="mis-solicitudes.html">
              <span class="item-icon" aria-hidden="true">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 1 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8z"/></svg>
              </span>

              <svg class="chevron" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
            </a>
          </li>
          <li>
            <a href="configuracion.html">
              <span class="item-icon" aria-hidden="true">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.9 2.9l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.6V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.9-2.9l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.6-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.9-2.9l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.6V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.6 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.9 2.9l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.6 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.6 1z"/></svg>
              </span>
              Configuración
              <svg class="chevron" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
            </a>
          </li>
          <li>
            <a href="index.html" class="danger">
              <span class="item-icon" aria-hidden="true">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>

        Buscar

      <a href="mis-solicitudes.html">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 1 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8z"/></svg>

      <a href="perfil.html" aria-current="page">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 21c0-4 3.6-6 8-6s8 2 8 6"/><circle cx="12" cy="8" r="4"/></svg>
