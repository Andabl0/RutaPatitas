<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Patitas Unidas — Momentos</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<a class="skip-link" href="#main">Saltar al contenido principal</a>
<div class="phone-frame">
  <div class="status-bar" aria-hidden="true"><span>9:52</span><span class="dot"></span><span></span></div>

  <main id="main" class="app-screen">
    <div class="topbar">
      <a class="btn-back" href="aceptar-solicitud.html" aria-label="Volver">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M15 5l-7 7 7 7"/></svg>
      </a>
      <h1>Momentos</h1>
    </div>

    <div class="screen-scroll">
      <button type="button" class="btn btn-secondary" style="margin-bottom:var(--space-5); display:flex; align-items:center; justify-content:center; gap:var(--space-2);">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        Agregar un momento
      </button>

      <article class="card moment-card">
        <div class="moment-head">
          <div class="avatar sm" aria-hidden="true">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 21c0-4 3.6-6 8-6s8 2 8 6"/><circle cx="12" cy="8" r="4"/></svg>
          </div>
          <div class="who">
            <p class="name">Ana Karen con Toby</p>
            <p class="when">Hoy · 4:10 p.m.</p>
          </div>
          <div class="moment-actions">
            <button type="button" class="btn-icon" aria-label="Compartir momento" style="background:transparent; color:var(--color-text-muted);">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.6" y1="10.6" x2="15.4" y2="6.4"/><line x1="8.6" y1="13.4" x2="15.4" y2="17.6"/></svg>
            </button>
            <button type="button" class="btn-icon" data-like aria-pressed="false" aria-label="Marcar como favorito" style="background:transparent; color:var(--color-secondary-dark);">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 1 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8z"/></svg>
            </button>
            <button type="button" class="btn-icon" aria-label="Eliminar momento" style="background:transparent; color:var(--color-text-muted);">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
            </button>
          </div>
        </div>
        <div class="moment-photo" role="img" aria-label="Toby jugando en el jardín durante su paseo de la tarde">
          <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="M21 15l-5-5-9 9"/></svg>
        </div>
        <p style="padding:var(--space-3) var(--space-4); font-size:13.5px; color:var(--color-text-muted);">Toby estuvo feliz jugando en el jardín. ¡Ya tomó agua y descansó!</p>
      </article>

      <article class="card moment-card">
        <div class="moment-head">
          <div class="avatar sm" aria-hidden="true">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 21c0-4 3.6-6 8-6s8 2 8 6"/><circle cx="12" cy="8" r="4"/></svg>
          </div>
          <div class="who">
            <p class="name">Ana Karen con Toby</p>
            <p class="when">Hoy · 3:35 p.m.</p>
          </div>
          <div class="moment-actions">
            <button type="button" class="btn-icon" aria-label="Compartir momento" style="background:transparent; color:var(--color-text-muted);">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.6" y1="10.6" x2="15.4" y2="6.4"/><line x1="8.6" y1="13.4" x2="15.4" y2="17.6"/></svg>
            </button>
            <button type="button" class="btn-icon" data-like aria-pressed="true" aria-label="Quitar de favoritos" style="background:transparent; color:var(--color-secondary-dark);">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 1 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8z"/></svg>
            </button>
            <button type="button" class="btn-icon" aria-label="Eliminar momento" style="background:transparent; color:var(--color-text-muted);">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
            </button>
          </div>
        </div>
        <div class="moment-photo" role="img" aria-label="Toby recién llegó y saluda a la cámara">
          <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="M21 15l-5-5-9 9"/></svg>
        </div>
      </article>
    </div>

    <nav class="bottom-nav" aria-label="Navegación principal">
      <a href="buscar-cuidadores.html">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.6" y2="16.6"/></svg>
        Buscar
      </a>
      <a href="solicitudes.html" aria-current="page">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 1 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8z"/></svg>
        Solicitudes
      </a>
      <a href="perfil.html">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 21c0-4 3.6-6 8-6s8 2 8 6"/><circle cx="12" cy="8" r="4"/></svg>
        Perfil
      </a>
    </nav>
  </main>
</div>
<script src="js/app.js"></script>
</body>
</html>
