<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Patitas Unidas — Detalles de solicitud</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<a class="skip-link" href="#main">Saltar al contenido principal</a>
<div class="phone-frame">
  <div class="status-bar" aria-hidden="true"><span>9:52</span><span class="dot"></span><span></span></div>

  <main id="main" class="app-screen">
    <div class="topbar">
      <a class="btn-back" href="agregar-mascota.html" aria-label="Volver">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M15 5l-7 7 7 7"/></svg>
      </a>
      <h1>Detalles de solicitud</h1>
    </div>

    <div class="screen-scroll" style="padding:0; display:flex; flex-direction:column;">
      <div class="map-box" role="img" aria-label="Mapa que muestra la ubicación del punto de encuentro en 2972 Westheimer Rd">
        <svg class="map-pin" width="34" height="34" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2C7.6 2 4 5.6 4 10c0 6 8 12 8 12s8-6 8-12c0-4.4-3.6-8-8-8zm0 11a3 3 0 110-6 3 3 0 010 6z"/></svg>
      </div>

      <div class="bottom-sheet" style="flex:1; display:flex; flex-direction:column;">
        <div class="sheet-person">
          <div class="avatar" role="img" aria-label="Foto de perfil de Ana Karen">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 21c0-4 3.6-6 8-6s8 2 8 6"/><circle cx="12" cy="8" r="4"/></svg>
          </div>
          <span class="name">Ana Karen</span>
          <a class="btn-icon" href="tel:+525512345678" aria-label="Llamar a Ana Karen" style="text-decoration:none;">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .3 2 .7 3a2 2 0 0 1-.4 2.1L8 10.2a16 16 0 0 0 6 6l1.4-1.4a2 2 0 0 1 2.1-.4c1 .4 2 .6 3 .7a2 2 0 0 1 1.7 2z"/></svg>
          </a>
        </div>

        <div class="detail-row">
          <span class="icon-wrap" aria-hidden="true">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2C7.6 2 4 5.6 4 10c0 6 8 12 8 12s8-6 8-12c0-4.4-3.6-8-8-8zm0 11a3 3 0 110-6 3 3 0 010 6z"/></svg>
          </span>
          <div>
            <p class="label">Ubicación</p>
            <p class="value">2972 Westheimer Rd. Santa Ana, Illinois 85486</p>
          </div>
        </div>

        <div class="detail-row">
          <span class="icon-wrap" aria-hidden="true">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>
          </span>
          <div>
            <p class="label">Tiempo de cuidado</p>
            <p class="value">3:00 p.m. (máx. 20 min de tolerancia)</p>
          </div>
        </div>

        <div class="detail-row">
          <span class="icon-wrap" aria-hidden="true">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 21c0-4 3.6-6 8-6s8 2 8 6"/><circle cx="12" cy="8" r="4"/></svg>
          </span>
          <div>
            <p class="label">Mascota</p>
            <p class="value">Toby · Labrador · 8 kg</p>
          </div>
        </div>

        <span class="chip chip-pending" style="margin-bottom:var(--space-4);">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="12" cy="12" r="10"/></svg>
          Esperando confirmación de Ana Karen
        </span>

        <div style="margin-top:auto;">
          <a href="solicitudes.html" class="btn btn-outline" style="text-decoration:none;">Ver mis solicitudes</a>
        </div>
      </div>
    </div>
  </main>
</div>
</body>
</html>
