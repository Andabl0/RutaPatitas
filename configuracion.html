<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Patitas Unidas — Configuración</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<a class="skip-link" href="#main">Saltar al contenido principal</a>
<div class="phone-frame">
  <div class="status-bar" aria-hidden="true"><span>9:52</span><span class="dot"></span><span></span></div>

  <main id="main" class="app-screen">
    <div class="topbar">
      <a class="btn-back" href="perfil.html" aria-label="Volver al perfil">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M15 5l-7 7 7 7"/></svg>
      </a>
      <h1>Configuración</h1>
    </div>

    <div class="screen-scroll">

      <h2 style="font-size:13px; text-transform:uppercase; letter-spacing:.04em; color:var(--color-text-muted); margin-bottom:var(--space-3);">Notificaciones</h2>
      <ul class="list-menu card" style="margin-bottom:var(--space-5);">
        <li style="display:flex; align-items:center; justify-content:space-between; padding:var(--space-4);">
          <label for="notif-solicitudes" style="font-size:15px;">Nuevas solicitudes</label>
          <span class="switch">
            <input type="checkbox" id="notif-solicitudes" checked>
            <span class="track" aria-hidden="true"></span>
            <span class="thumb" aria-hidden="true"></span>
          </span>
        </li>
        <li style="display:flex; align-items:center; justify-content:space-between; padding:var(--space-4);">
          <label for="notif-chat" style="font-size:15px;">Mensajes de chat</label>
          <span class="switch">
            <input type="checkbox" id="notif-chat" checked>
            <span class="track" aria-hidden="true"></span>
            <span class="thumb" aria-hidden="true"></span>
          </span>
        </li>
        <li style="display:flex; align-items:center; justify-content:space-between; padding:var(--space-4);">
          <label for="notif-promos" style="font-size:15px;">Promociones y novedades</label>
          <span class="switch">
            <input type="checkbox" id="notif-promos">
            <span class="track" aria-hidden="true"></span>
            <span class="thumb" aria-hidden="true"></span>
          </span>
        </li>
      </ul>

      <h2 style="font-size:13px; text-transform:uppercase; letter-spacing:.04em; color:var(--color-text-muted); margin-bottom:var(--space-3);">Accesibilidad</h2>
      <ul class="list-menu card" style="margin-bottom:var(--space-5);">
        <li style="display:flex; align-items:center; justify-content:space-between; padding:var(--space-4);">
          <label for="acc-motion" style="font-size:15px;">Reducir animaciones</label>
          <span class="switch">
            <input type="checkbox" id="acc-motion">
            <span class="track" aria-hidden="true"></span>
            <span class="thumb" aria-hidden="true"></span>
          </span>
        </li>
        <li style="display:flex; align-items:center; justify-content:space-between; padding:var(--space-4);">
          <label for="acc-text" style="font-size:15px;">Texto más grande</label>
          <span class="switch">
            <input type="checkbox" id="acc-text">
            <span class="track" aria-hidden="true"></span>
            <span class="thumb" aria-hidden="true"></span>
          </span>
        </li>
        <li style="display:flex; align-items:center; justify-content:space-between; padding:var(--space-4);">
          <label for="acc-contrast" style="font-size:15px;">Alto contraste</label>
          <span class="switch">
            <input type="checkbox" id="acc-contrast">
            <span class="track" aria-hidden="true"></span>
            <span class="thumb" aria-hidden="true"></span>
          </span>
        </li>
      </ul>

      <h2 style="font-size:13px; text-transform:uppercase; letter-spacing:.04em; color:var(--color-text-muted); margin-bottom:var(--space-3);">Privacidad y cuenta</h2>
      <ul class="list-menu card" style="margin-bottom:var(--space-5);">
        <li>
          <a href="#">
            <span class="item-icon" aria-hidden="true">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="11" width="18" height="10" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            </span>
            Privacidad y datos
            <svg class="chevron" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
          </a>
        </li>
        <li>
          <a href="#">
            <span class="item-icon" aria-hidden="true">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><circle cx="12" cy="8" r="0.5"/></svg>
            </span>
            Ayuda y soporte
            <svg class="chevron" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
          </a>
        </li>
        <li>
          <button type="button" class="list-item danger">
            <span class="item-icon" aria-hidden="true">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/></svg>
            </span>
            Eliminar cuenta
          </button>
        </li>
      </ul>

      <p style="text-align:center; font-size:12.5px; color:var(--color-text-muted); margin-bottom:var(--space-4);">Patitas Unidas · Versión 1.0.0</p>
    </div>

    <nav class="bottom-nav" aria-label="Navegación principal">
      <a href="buscar-cuidadores.html">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.6" y2="16.6"/></svg>
        Buscar
      </a>
      <a href="solicitudes.html">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 1 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8z"/></svg>
        Solicitudes
      </a>
      <a href="perfil.html" aria-current="page">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 21c0-4 3.6-6 8-6s8 2 8 6"/><circle cx="12" cy="8" r="4"/></svg>
        Perfil
      </a>
    </nav>
  </main>
</div>
<script src="js/app.js"></script>
</body>
</html>
