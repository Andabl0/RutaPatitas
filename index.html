<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Patitas Unidas — Bienvenido</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<a class="skip-link" href="#main">Saltar al contenido principal</a>
<div class="phone-frame">
  <div class="status-bar" aria-hidden="true">
    <span>9:52</span>
    <span class="dot"></span>
    <span class="icons">
      <svg width="18" height="12" viewBox="0 0 18 12"><path d="M1 8 L9 1 L17 8" stroke="#333" stroke-width="1.4" fill="none"/></svg>
      <svg width="20" height="12" viewBox="0 0 20 12"><rect x="1" y="1" width="16" height="10" rx="2" stroke="#333" fill="none"/><rect x="3" y="3" width="10" height="6" fill="#333"/></svg>
    </span>
  </div>

  <main id="main" class="app-screen">
    <div class="screen-scroll" style="display:flex; flex-direction:column; justify-content:center; flex:1;">

      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <svg width="40" height="40" viewBox="0 0 24 24" fill="currentColor"><circle cx="7" cy="7" r="2.2"/><circle cx="12" cy="4.8" r="2.2"/><circle cx="17" cy="7" r="2.2"/><path d="M12 10.5c-3.6 0-6.4 2.3-6.4 5 0 1.9 1.7 3 3.7 2.4.9-.3 1.8-.4 2.7-.4s1.8.1 2.7.4c2 .6 3.7-.5 3.7-2.4 0-2.7-2.8-5-6.4-5z"/></svg>
        </div>
        <span class="brand-name">Patitas Unidas</span>
        <span class="brand-tagline">Encuentra a tu mejor amigo</span>
      </div>

      <p style="text-align:center; color:var(--color-text-muted); font-size:14px; margin-bottom:var(--space-5);">
        Elige cómo quieres empezar. Podrás cambiarlo después desde tu perfil.
      </p>

      <nav class="role-options" aria-label="Elegir tipo de cuenta">
        <a class="role-card role-adopt" href="login.html?rol=adoptante">
          <span class="role-icon" aria-hidden="true">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 1 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8z"/></svg>
          </span>
          <span class="role-text">
            <span class="title">Quiero adoptar</span>
            <span class="sub">Busca mascotas esperando un hogar</span>
          </span>
        </a>
        <a class="role-card role-foster" href="registro.html?rol=refugio">
          <span class="role-icon" aria-hidden="true">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
          </span>
          <span class="role-text">
            <span class="title">Refugio / Rescatista</span>
            <span class="sub">Publica mascotas en adopción y gestiona solicitudes</span>
          </span>
        </a>
      </nav>

    </div>
  </main>
</div>
</body>
</html>
