<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Patitas Unidas — Bienvenido</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<a class="skip-link" href="#main">Saltar al contenido principal</a>
<div class="phone-frame">
  <div class="status-bar" aria-hidden="true">
    <span>9:52</span>
    <span class="dot"></span>
    <span class="icons">
      <svg width="18" height="12" viewBox="0 0 18 12"><path d="M1 8 L9 1 L17 8" stroke="#333" stroke-width="1.4" fill="none"/></svg>
      <svg width="20" height="12" viewBox="0 0 20 12"><rect x="1" y="1" width="16" height="10" rx="2" stroke="#333" fill="none"/><rect x="3" y="3" width="10" height="6" fill="#333"/></svg>
    </span>
  </div>

  <main id="main" class="app-screen">
    <div class="screen-scroll" style="display:flex; flex-direction:column; justify-content:center; flex:1;">

      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <svg width="40" height="40" viewBox="0 0 24 24" fill="currentColor"><circle cx="7" cy="7" r="2.2"/><circle cx="12" cy="4.8" r="2.2"/><circle cx="17" cy="7" r="2.2"/><path d="M12 10.5c-3.6 0-6.4 2.3-6.4 5 0 1.9 1.7 3 3.7 2.4.9-.3 1.8-.4 2.7-.4s1.8.1 2.7.4c2 .6 3.7-.5 3.7-2.4 0-2.7-2.8-5-6.4-5z"/></svg>
        </div>
        <span class="brand-name">Patitas Unidas</span>
        <span class="brand-tagline">Cuidado con confianza, entre vecinos</span>
      </div>

      <p style="text-align:center; color:var(--color-text-muted); font-size:14px; margin-bottom:var(--space-5);">
        Elige cómo quieres empezar. Podrás cambiarlo después desde tu perfil.
      </p>

      <nav class="role-options" aria-label="Elegir tipo de cuenta">
        <a class="role-card role-owner" href="login.html?rol=dueno">
          <span class="role-icon" aria-hidden="true">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 21c0-4 3.6-6 8-6s8 2 8 6"/><circle cx="12" cy="8" r="4"/></svg>
          </span>
          <span class="role-text">
            <span class="title">Tengo una mascota</span>
            <span class="sub">Busca cuidadores de confianza cerca de ti</span>
          </span>
        </a>
        <a class="role-card role-sitter" href="registro.html?rol=cuidador">
          <span class="role-icon" aria-hidden="true">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="7" cy="7" r="2"/><circle cx="12" cy="4.8" r="2"/><circle cx="17" cy="7" r="2"/><path d="M6 19c0-2.6 2.7-4.7 6-4.7s6 2.1 6 4.7"/></svg>
          </span>
          <span class="role-text">
            <span class="title">Ofrezco mis servicios</span>
            <span class="sub">Regístrate como cuidador y recibe solicitudes</span>
          </span>
        </a>
      </nav>

    </div>
  </main>
</div>
</body>
</html>
