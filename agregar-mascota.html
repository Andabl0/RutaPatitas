<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Patitas Unidas — Agregar mascota</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<a class="skip-link" href="#main">Saltar al contenido principal</a>
<div class="phone-frame">
  <div class="status-bar" aria-hidden="true"><span>9:52</span><span class="dot"></span><span></span></div>

  <main id="main" class="app-screen">
    <div class="topbar">
      <a class="btn-back" href="cuidador-perfil.html" aria-label="Volver al perfil de la cuidadora">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M15 5l-7 7 7 7"/></svg>
      </a>
      <h1>Agregar mascota</h1>
    </div>

    <div class="screen-scroll">
      <div style="display:flex; justify-content:center; margin-bottom:var(--space-5);">
        <button type="button" class="avatar" style="width:96px; height:96px; border:2px dashed var(--color-border-strong); cursor:pointer; background:var(--color-bg);"
          aria-label="Agregar una foto de tu mascota">
          <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="M21 15l-5-5-9 9"/></svg>
        </button>
      </div>

      <form data-validate="detalle-solicitud.html" novalidate>
        <div class="field">
          <label for="pet-name">Nombre</label>
          <input type="text" id="pet-name" placeholder="Nombre de tu mascota" required>
          <p class="error-msg" role="alert" hidden>Escribe el nombre de tu mascota.</p>
        </div>

        <div class="field">
          <label for="pet-breed">Raza</label>
          <input type="text" id="pet-breed" placeholder="Ej. Labrador, mestizo…" required>
          <p class="error-msg" role="alert" hidden>Escribe la raza de tu mascota.</p>
        </div>

        <div class="field">
          <label for="pet-weight">Peso (kg)</label>
          <input type="number" id="pet-weight" placeholder="Ej. 8" min="0" step="0.1" required>
          <p class="error-msg" role="alert" hidden>Escribe el peso aproximado en kilogramos.</p>
        </div>

        <div class="field">
          <label for="pet-notes">Algo que el cuidador debe saber</label>
          <textarea id="pet-notes" placeholder="Alergias, medicamentos, comportamiento…"></textarea>
          <p class="hint">Opcional, pero ayuda a que el cuidado sea más seguro.</p>
        </div>

        <div class="field">
          <label for="pet-time">Tiempo de cuidado</label>
          <select id="pet-time" required>
            <option value="">Selecciona una duración</option>
            <option>30 minutos</option>
            <option>1 hora</option>
            <option>Medio día</option>
            <option>Día completo</option>
          </select>
          <p class="error-msg" role="alert" hidden>Selecciona cuánto tiempo necesitas el cuidado.</p>
        </div>

        <button type="submit" class="btn btn-primary">Solicitar</button>
      </form>
    </div>

    <nav class="bottom-nav" aria-label="Navegación principal">
      <a href="buscar-cuidadores.html">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.6" y2="16.6"/></svg>
        Buscar
      </a>
      <a href="solicitudes.html">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 1 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8z"/></svg>
        Solicitudes
      </a>
      <a href="perfil.html">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 21c0-4 3.6-6 8-6s8 2 8 6"/><circle cx="12" cy="8" r="4"/></svg>
        Perfil
      </a>
    </nav>
  </main>
</div>
<script src="js/app.js"></script>
</body>
</html>
