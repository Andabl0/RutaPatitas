<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Patitas Unidas — Iniciar sesión</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<a class="skip-link" href="#main">Saltar al contenido principal</a>
<div class="phone-frame">
  <div class="status-bar" aria-hidden="true"><span>9:52</span><span class="dot"></span><span></span></div>

  <main id="main" class="app-screen">
    <div class="screen-scroll">

      <div class="brand" style="margin-top:var(--space-5);">
        <div class="brand-mark" aria-hidden="true">
          <svg width="40" height="40" viewBox="0 0 24 24" fill="currentColor"><circle cx="7" cy="7" r="2.2"/><circle cx="12" cy="4.8" r="2.2"/><circle cx="17" cy="7" r="2.2"/><path d="M12 10.5c-3.6 0-6.4 2.3-6.4 5 0 1.9 1.7 3 3.7 2.4.9-.3 1.8-.4 2.7-.4s1.8.1 2.7.4c2 .6 3.7-.5 3.7-2.4 0-2.7-2.8-5-6.4-5z"/></svg>
        </div>
        <span class="brand-name">Patitas Unidas</span>
      </div>

      <h1 style="font-size:24px; text-align:center; margin-bottom:var(--space-5);">Iniciar sesión</h1>

      <form data-validate="buscar-mascotas.html" novalidate>
        <div class="field">
          <label for="login-user">Correo electrónico</label>
          <input type="email" id="login-user" name="usuario" placeholder="tucorreo@ejemplo.com" required autocomplete="email">
          <p class="error-msg" role="alert" hidden>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" aria-hidden="true"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="13"/><circle cx="12" cy="16.5" r="0.5"/></svg>
            Escribe tu correo electrónico para continuar.
          </p>
        </div>

        <div class="field">
          <label for="login-pass">Contraseña</label>
          <div style="position:relative;">
            <input type="password" id="login-pass" name="password" placeholder="Tu contraseña" required autocomplete="current-password" style="padding-right:48px;">
            <button type="button" class="btn-icon" data-toggle-password="login-pass" aria-pressed="false" aria-label="Mostrar contraseña"
              style="position:absolute; right:2px; top:2px; background:transparent; color:var(--color-text-muted);">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
          <p class="error-msg" role="alert" hidden>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" aria-hidden="true"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="13"/><circle cx="12" cy="16.5" r="0.5"/></svg>
            Ingresa tu contraseña para continuar.
          </p>
        </div>

        <p style="text-align:right; margin-bottom:var(--space-5);">
          <a href="#" style="font-size:13.5px; color:var(--color-accent-dark); font-weight:600;">¿Has olvidado tu contraseña?</a>
        </p>

        <button type="submit" class="btn btn-primary">Iniciar sesión</button>
      </form>

      <div class="divider-text">O inicia sesión con</div>
      <div class="social-row">
        <button type="button" class="btn-social" aria-label="Continuar con Google">
          <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path fill="#4285F4" d="M23.5 12.3c0-.8-.1-1.6-.2-2.3H12v4.5h6.5c-.3 1.5-1.1 2.8-2.4 3.6v3h3.9c2.3-2.1 3.5-5.2 3.5-8.8z"/><path fill="#34A853" d="M12 24c3.2 0 5.9-1.1 7.9-2.9l-3.9-3c-1.1.7-2.4 1.1-4 1.1-3.1 0-5.7-2.1-6.6-4.9H1.4v3.1C3.4 21.3 7.4 24 12 24z"/><path fill="#FBBC05" d="M5.4 14.3c-.2-.7-.4-1.5-.4-2.3s.1-1.6.4-2.3V6.6H1.4C.5 8.3 0 10.1 0 12s.5 3.7 1.4 5.4l4-3.1z"/><path fill="#EA4335" d="M12 4.8c1.8 0 3.3.6 4.6 1.8l3.4-3.4C17.9 1.2 15.2 0 12 0 7.4 0 3.4 2.7 1.4 6.6l4 3.1C6.3 6.9 8.9 4.8 12 4.8z"/></svg>
          Google
        </button>
        <button type="button" class="btn-social" aria-label="Continuar con Facebook">
          <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="12" fill="#1877F2"/><path fill="#fff" d="M15.1 12.6h-2v7.4h-3v-7.4H8.5v-2.6h1.6V8.4c0-1.6.8-3.1 3.4-3.1h2.1v2.5h-1.5c-.4 0-.8.3-.8.9v1.3h2.4l-.6 2.6z"/></svg>
          Facebook
        </button>
      </div>

      <p class="form-footer-link">¿No tienes una cuenta? <a href="registro.html">Regístrate</a></p>
    </div>
  </main>
</div>
<script src="js/app.js"></script>
</body>
</html>
